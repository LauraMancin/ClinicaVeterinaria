<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/patinha.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/login.css">
    <title>VetCare</title>
</head>
<body>
    <main class="container">
        <h1 class="tituloContainer">Bem-Vindo de Volta!</h1>
        <p class="subtituloContainer">Entre para acompanhar a saúde do seu pet</p>

        <section class="formularioContainer">
            <div class="botoesContainer"> 
                <button class="botao">Entrar</button>
                <button class="botao">Cadastrar</button>
            </div>

            <div class="inputContainerEmail">
                <input type="text" placeholder="Email">
            </div>

            <div class="inputContainer">
                <input type="text" placeholder="Senha">
            </div>

            <div class="esqueceuSenha">
                <p>Esqueceu a senha?</p>
            </div>

            <div class="botaoEntrar">
                <button>Entrar</button>
            </div>

            <div class="cadastrar">
                <p>Não tem conta?<a> Cadastre-se</a></p>
            </div>
        </section>

    </main>
</body>
</html>
