<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/patinha.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/login.css">
    <title>VetCare</title>
</head>
<body>
    <main class="container">
        <h1 class="tituloContainer">Bem-Vindo de Volta!</h1>
        <p class="subtituloContainer">Entre para acompanhar as consultas do dia</p>

        <section class="formularioContainer">
            <div class="botoesContainer"> 
                <button class="botao">Entrar</button>
                <button class="botao">Cadastrar</button>
            </div>

            <div class="inputContainer">
                <p>E-mail</p>
                <input type="text" placeholder="E-mail">
            </div>

            <div class="inputContainer">
                <p>Senha</p>
                <input type="text" placeholder="Senha">
            </div>

            <div class="esqueceuSenha">
                <p>Esqueceu a senha?</p>
            </div>

            <div class="botaoEntrar">
                <p>Entrar</p>
            </div>

            <div class="cadastrar">
                <p>Não tem conta?<a> Cadastre-se</a></p>
            </div>
        </section>

        <section class="containerCadastro">
            <h1 class="tituloContainer">Crie sua conta</h1>
            <p class="subtituloContainer">Cadastre-se e conheça suas consultas</p>
            <div>
                <div class="inputContainer">
                    <p>E-mail</p>
                    <input type="text" placeholder="Email">
                </div>
    
                <div class="inputContainer">
                    <p>Senha</p>
                    <input type="text" placeholder="Senha">
                </div>

                <div class="inputContainer">
                    <p>Confirme a senha</p>
                    <input type="text" placeholder="Senha">
                </div>

                <div class="inputContainer">
                    <p>Especilidade</p>
                    <input type="text" placeholder="Especialidade">
                </div>
    
    
                <div class="botaoEntrar">
                    <button>Criar Conta</button>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
